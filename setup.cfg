[metadata]
name = tennpot
version = 0.1.0
description = Official python code for the Te-dependent neural network interatomic potential
author = Pascal Plettenberg
author_email = plettenberg@uni-kassel.de
license = MIT
license_files = LICENSE
long_description = file: README.rst
long_description_content_type = text/x-rst; charset=UTF-8
url = https://github.com/pasplett/TeNNPot
project_urls =
    Article = https://doi.org/10.1038/s43246-023-00389-w
    Source = https://github.com/pasplett/TeNNPot
    Tracker = https://github.com/pasplett/TeNNPot/issues

platforms = any

classifiers =
    Development Status :: 4 - Beta
    Intended Audience :: Science/Research
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent
    Programming Language :: Python
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13
    Programming Language :: Python :: 3.14
    Topic :: Scientific/Engineering :: Physics

[options]
zip_safe = False
packages = find_namespace:
include_package_data = True
package_dir =
    =src

python_requires = >=3.10

install_requires =
    ase >= 3.23
    numpy >= 1.26.1
    torch >= 2.13.0

[options.packages.find]
where = src
exclude =
    tests

[options.package_data]
tennpot =
    configs/*.json
    saved_models/*.pt
    saved_models/*.json

[options.extras_require]

testing =
    black
    flake8
    setuptools
    pytest
    pytest-cov
training =
mlflow =
    mlflow >= 3.16.1
    cryptography >= 50.0.0
    GitPython >= 3.1.60
    multidict >= 6.9.1
    urllib3 >= 2.8.0
    Werkzeug >= 3.1.9
reproduction =
    matplotlib >= 3.8
all =
    mlflow >= 3.16.1
    cryptography >= 50.0.0
    GitPython >= 3.1.60
    multidict >= 6.9.1
    urllib3 >= 2.8.0
    Werkzeug >= 3.1.9
    matplotlib >= 3.8

[options.entry_points]
console_scripts =
    tennpot-train = tennpot.cli.train:main
    tennpot-predict = tennpot.cli.predict:main
    cohesive = tennpot.cli.plot_properties:cohesive_main
    phonons = tennpot.cli.plot_properties:phonons_main
    internal-energy = tennpot.cli.plot_properties:internal_energy_main
    specific-heat = tennpot.cli.plot_properties:specific_heat_main
    tennpot-md = tennpot.cli.plot_properties:tennpot_md_main
    tennpot-figure3 = tennpot.cli.reproduce_fig3:main

[tool:pytest]
addopts =
    --cov tennpot --cov-report term-missing --cov-fail-under 85
    --verbose
norecursedirs =
    dist
    build
testpaths = tests
markers =
    data: requires the untracked full CHIVES data archive
    mlflow: requires the optional MLflow dependency

[flake8]
max_line_length = 88
# Match Black formatting.
extend_ignore = E203, W503
exclude =
    build
    dist
    .eggs
