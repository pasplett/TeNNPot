name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip ".[testing,reproduction]"
      - name: Lint
        run: flake8 src tests
      - name: Format
        run: black --check src tests
      - name: Test
        run: pytest -m "not mlflow"

  mlflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install MLflow integration dependencies
        run: python -m pip install --upgrade pip ".[testing,mlflow]"
      - name: Test MLflow integration
        run: pytest --no-cov -m mlflow tests/test_training.py

  distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build tools
        run: python -m pip install --upgrade pip build twine
      - name: Build distributions
        run: python -m build
      - name: Validate metadata
        run: python -m twine check dist/*
      - name: Check distribution contents
        run: |
          python - <<'PY'
          from pathlib import Path
          import tarfile
          import zipfile

          with tarfile.open(next(Path("dist").glob("*.tar.gz"))) as archive:
              paths = {member.name.split("/", 1)[1] for member in archive if member.isfile()}
          assert not any(p.startswith("data/") for p in paths)
          assert "RESEARCH_WORKFLOW.md" in paths
          assert {p for p in paths if p.endswith(".npz")} == {"tests/test_tennpot.npz"}
          assert {p for p in paths if p.endswith(".pt")} == {"src/tennpot/saved_models/silicon_2023.pt"}
          private_dirs = {"_archive", "_old_code", "runs", "results", "mlruns", "tmp", ".git", ".tmp_publication_review"}
          assert not any(p.split("/")[0] in private_dirs for p in paths)
          assert "IMPLEMENTATION_PLAN.md" not in paths
          assert "examples/silicon_demo.extxyz" in paths
          assert "MANIFEST.in" in paths
          with zipfile.ZipFile(next(Path("dist").glob("*.whl"))) as wheel:
              assert "tennpot/saved_models/silicon_2023.pt" in wheel.namelist()
              assert "tennpot/configs/silicon_tiny.json" in wheel.namelist()
          PY
      - name: Install built wheel
        run: python -m pip install dist/*.whl
      - name: Smoke-test installed resources and commands
        run: |
          python -c "from tennpot import load_published_model, published_model_info; assert load_published_model().atomic_nn.nodes_in == 74; assert published_model_info()['element'] == 'Si'"
          tennpot-predict --help
          tennpot-train --help
          cohesive --help
          phonons --help
          internal-energy --help
          specific-heat --help
          tennpot-md --help
          tennpot-figure3 --help
